# Główna konfiguracja narzędzia do migracji bazy danych (Alembic)

[alembic]
# Katalog zawierający skrypty środowiskowe i wersje migracji
script_location = alembic
# Dodaje bieżący katalog (backend/) do PYTHONPATH, aby działały importy "from app..."
prepend_sys_path = .
# Separator ścieżek zależny od systemu operacyjnego
version_path_separator = os

# Konfiguracja logowania (standardowe ustawienia Alembic)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S