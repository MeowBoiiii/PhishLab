services:
  db:
    image: postgres:15-alpine
    container_name: phishlab_db
    restart: always
    environment:
      POSTGRES_USER: phishlab_user
      POSTGRES_PASSWORD: phishlab_password
      POSTGRES_DB: phishlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishlab_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=phishlab_user
      - POSTGRES_PASSWORD=phishlab_password
      - POSTGRES_DB=phishlab
      - POSTGRES_PORT=5432
      - SECRET_KEY=temporary_dev_secret_key_change_in_production
    depends_on:
      - db

volumes:
  postgres_data:
