version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: phishlab_db
    restart: always
    environment:
      POSTGRES_USER: phishlab_user
      POSTGRES_PASSWORD: phishlab_password
      POSTGRES_DB: phishlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: